name: Verify v0.76 Linux core load

on:
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the exact Linux build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38273324130 \
            --repo OldManCraveGuitars-bit/MegaCD-Snatcher-Kr \
            --name genesis-plus-gx-snatcher-kr-linux-x86_64 \
            --dir core
      - name: Verify identity and libretro API load
        run: |
          echo 'b80f2203d5ca16cf8733d6bd2d99099d528a2fb046c7f271df5b98d3670e5b3d  core/genesis_plus_gx_libretro.so' | sha256sum --check
          python3 - <<'PY'
          import ctypes
          core = ctypes.CDLL('./core/genesis_plus_gx_libretro.so')
          core.retro_api_version.restype = ctypes.c_uint
          version = core.retro_api_version()
          assert version == 1, version
          print(f'Linux shared library loaded; libretro API version {version}')
          PY
